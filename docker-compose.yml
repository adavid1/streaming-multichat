services:
  multichat:
    build:
      context: .
      dockerfile: Dockerfile
    # Or use the image published by the CI:
    # image: ghcr.io/adavid1/streaming-multichat:latest
    container_name: multichat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8787
    ports:
      - "8787:8787"
